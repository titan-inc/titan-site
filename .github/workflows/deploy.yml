name: Deploy

# Reage ao workflow CI, não repete os steps dele (TIT-102). branches:[main]
# aqui filtra pela branch em que o CI RODOU -- isso já exclui os runs do CI
# disparados por pull_request de outras branches, sem precisar checar o
# tipo de evento à parte.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# Não cancela um deploy em andamento: interromper no meio deixaria o ghcr.io
# com uma imagem parcial ou a instância com containers pela metade.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      # Builda o commit exato que o CI verificou, não o que `main` for no
      # instante em que este job rodar -- protege contra corrida se outro
      # push acontecer entre o merge e este workflow disparar.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/titan-inc/titan-api:latest
            ghcr.io/titan-inc/titan-api:${{ github.event.workflow_run.head_sha }}
          # gha: reaproveita o --mount=type=cache do pnpm entre runs. Sem
          # isto, o cache mount do Dockerfile é inútil em CI -- cada run
          # pega um runner novo e o cache "local" nunca sobrevive.
          cache-from: type=gha,scope=titan-api
          cache-to: type=gha,mode=max,scope=titan-api

      - name: Build e push do web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Ver o aviso no topo do apps/web/Dockerfile: isto fica AMARRADO
          # na imagem. Precisa bater com o domínio real (Caddyfile roteia
          # /api pra api).
          build-args: |
            NEXT_PUBLIC_API_URL=https://titaninc.com.br/api
          tags: |
            ghcr.io/titan-inc/titan-web:latest
            ghcr.io/titan-inc/titan-web:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=titan-web
          cache-to: type=gha,mode=max,scope=titan-web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Mesmo commit que foi buildado -- não o que main for agora.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copiar docker-compose.prod.yml e Caddyfile pra instância
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.prod.yml,Caddyfile'
          target: /opt/titan-site
          strip_components: 0

      # docker compose up -d NÃO repuxa imagem nova sozinho quando a tag é
      # `latest` (mutável) -- ele só usa o que já está em cache local. Por
      # isso o pull explícito antes do up.
      #
      # .env e a senha do banco JÁ existem na instância (TIT-106) -- este
      # job nunca cria nem edita segredo, só troca as imagens e reinicia.
      - name: Pull das imagens novas e restart dos containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/titan-site
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
