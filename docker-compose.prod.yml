# docker-compose.prod.yml
#
# Produção. Diferente do docker-compose.yml de dev: aqui sobem os três
# serviços, e nenhuma imagem é buildada aqui — web e api vêm prontas do
# GitHub Container Registry (ver milestone 4, TIT-100/101).
#
# Migrations NÃO rodam automaticamente no boot da API (ver apps/api/Dockerfile).
# Depois de um `docker compose -f docker-compose.prod.yml up -d`, rodar:
#   docker compose -f docker-compose.prod.yml exec api ./node_modules/.bin/prisma migrate deploy

services:
  postgres:
    image: postgres:18-alpine
    container_name: titan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - titan-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # SEM `ports:` de propósito — só a api fala com o banco, pela rede
    # interna do compose. Publicar 5432 no host exporia o Postgres à internet.

  api:
    image: ghcr.io/leonardodasilveira/titan-api:${IMAGE_TAG:-latest}
    container_name: titan-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/leonardodasilveira/titan-web:${IMAGE_TAG:-latest}
    container_name: titan-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: titan-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  titan-pgdata:
    name: titan-pgdata
  caddy-data:
    name: titan-caddy-data
  caddy-config:
    name: titan-caddy-config
