# docker-compose.prod.yml
#
# Produção. Diferente do docker-compose.yml de dev: aqui sobem os três
# serviços, e nenhuma imagem é buildada aqui — web e api vêm prontas do
# GitHub Container Registry (ver milestone 4, TIT-100/101).
#
# Migrations NÃO rodam no boot da API (ver apps/api/Dockerfile) — mas rodam no
# deploy: o deploy.yml as aplica entre o `pull` e o `up -d` (TIT-146).
#
# À mão, num rollback ou conserto, o comando é:
#   docker compose -f docker-compose.prod.yml run --rm api ./node_modules/.bin/prisma migrate deploy
#
# `run --rm`, e não `exec`: usa a imagem puxada, não o container no ar. Com os
# dois iguais dá no mesmo; no meio de um deploy, não.

services:
  postgres:
    image: postgres:18-alpine
    container_name: titan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - titan-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Publicada só na LOOPBACK do host (127.0.0.1), nunca em 0.0.0.0 — isso
    # não expõe nada pra internet, só torna a porta alcançável por um túnel
    # SSH (`ssh -L`), que do lado do servidor chega como se fosse conexão
    # local. Acesso direto ao banco é só assim; a api continua falando com
    # ele pela rede interna do compose, sem depender disto.
    ports:
      - '127.0.0.1:5432:5432'

  api:
    image: ghcr.io/titan-inc/titan-api:${IMAGE_TAG:-latest}
    container_name: titan-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback só, mesmo padrão do Postgres acima — não expõe nada pra
    # internet (o Caddy já bloqueia /api/internal/ops/* no domínio público,
    # ver Caddyfile), só habilita túnel SSH direto pro processo já rodando,
    # sem passar pelo Caddy. Usado pelas rotas /internal/ops/* — TIT-109.
    ports:
      - '127.0.0.1:3001:3001'

  web:
    image: ghcr.io/titan-inc/titan-web:${IMAGE_TAG:-latest}
    container_name: titan-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: titan-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  titan-pgdata:
    name: titan-pgdata
  caddy-data:
    name: titan-caddy-data
  caddy-config:
    name: titan-caddy-config
